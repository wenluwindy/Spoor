[package]
name = "spoor"
version = "0.5.0"
description = "踪迹 · Spoor — local-first spatial note taking"
authors = ["AI Studio"]
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "multipart", "rustls-tls", "stream"] }
futures-util = "0.3"
open = "5"
# 本地推理改为子进程调用预编译 llama-cli.exe，无需从源码编译 CUDA llama.cpp
encoding_rs = "0.8"
# time：RightAPI 异步绘图要按间隔轮询任务状态；
# macros/sync：生图取消要 select! 掐掉进行中的请求，Rust 侧文件对话框回调要 oneshot 传回结果
tokio = { version = "1", features = ["rt-multi-thread", "time", "macros", "sync"] }
uuid = { version = "1.24.0", features = ["v4"] }
chrono = { version = "0.4.45", default-features = false, features = ["clock"] }
mime_guess = "2.0.5"
tauri-plugin-dialog = "2.7.2"
base64 = "0.23.0"
rusqlite = { version = "0.37", features = ["bundled"] }

# keystore.rs：AI 配置加密落盘。Windows 走 DPAPI（0.61 与 tauri 依赖树里的同版），
# macOS 走 Security framework 的钥匙串；其余平台明文降级（见 keystore.rs 文件头）。
[target.'cfg(windows)'.dependencies]
windows = { version = "0.61", features = ["Win32_Foundation", "Win32_Security_Cryptography"] }

[target.'cfg(target_os = "macos")'.dependencies]
security-framework = "3"

[lib]
name = "spoor_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "spoor"
path = "src/main.rs"
